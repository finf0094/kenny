name: Docs site

# Publishes the documentation to GitHub Pages on every push to main.
# One manual step is needed first: Settings → Pages → Source → "GitHub Actions".
# Until then the workflow stays green and says what is missing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=The docs site is not published::Switch GitHub Pages on: Settings → Pages → Source → GitHub Actions. The next push to main will publish the site."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Build the site for its address
        if: steps.pages.outputs.enabled == 'true'
        # A project site lives under /<repository>/, so links and assets need that prefix
        run: |
          pnpm install --frozen-lockfile
          pnpm build:tokens && pnpm build:ui && pnpm gen
          pnpm ng build docs --base-href "/${{ github.event.repository.name }}/"
          cp dist/docs/browser/index.csr.html dist/docs/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist/docs/browser
      - name: Publish
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
      - name: Address
        if: steps.pages.outputs.enabled == 'true'
        run: echo "Published at ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
